<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="FormValidationC2.css">
</head>

<!-- style="vertical-align: middle;" -->

<body>
  <div class="main">

    <!-- trong thực tế ko có hai cái form này đâu chỉ là ví dụ  thôi  -->
    <form action="" method="POST" class="form" id="register-form">
      <h3 class="heading">Đăng nhập</h3>
      <p class="desc">học lập trình ❤️</p>

      <div class="spacer"></div>

      <div class="form-group ">
        <label for="fullname" class="form-label">Tên đầy đủ</label>
        <input rules="required" id="fullname" name="fullname" type="text" placeholder="VD: Long Phạm"
          class="form-control">
        <span class="form-message"></span>

      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <!-- rules="required|email" masy casi nafy tự qui ước ra tự định nghĩa  -->
        <input id="email" name="email" rules="required|email" type="text" placeholder="VD: email@long.com"
          class="form-control">
        <span class="form-message"></span>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Mật khẩu</label>
        <input id="password" name="password" rules="required|min:6" type="password" placeholder="Nhập mật khẩu"
          class="form-control">
        <span class="form-message"></span>
      </div>

      <button class="form-submit">Đăng nhập</button>
    </form>
  </div>
  <script src="FormValidationC2.js"></script>

</body>
