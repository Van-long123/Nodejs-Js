    <h3 class="heading">Thành viên đăng ký</h3>
    <p class="desc">học lập trình  ❤️</p>

    <!-- dưới đây là file thì cũng như input thế thôi nhưng nó sẽ trả về value là chỗ lưu file

      <label for="avatar" class="form-label">ảnh đại diện</label>
      <input   id="avatar" name="avatar"  type="file" class="form-control">

    </div>

<!-- hoạt động giống như input thees thooi chọn là có giá trị trên input luôn chỉ .value là lấy về

    <div class="form-group">

      <select   id="province" name="province" class="form-control">
        <option value="">--chọn tỉnh/tp--</option>
        <option value="hni">hà Nội</option>
        <option value="hpg">Phải Phòng</option>

      </select>
      <span class="form-message"></span>
    </div>

    kiểu radi là chọn một còn checkbõ là chọn nhiều đc kiểu chọnn nhiều nhưng nó chỉ chọn đc một thằng đầu tiên đó là lỗi của checkbox 
    -->
    <div class="form-group">
      <label for="password_confirmation" class="form-label">Giới tính</label>
      <div class="Gender">
        <!-- có thằng checked này thì nó sẽ tự chọn thẳng còn ko là nhấn chọn đúng đắn nhất là ko nên có checked -->
        <input  name="gender" type="checkbox" value="male" class="form-control">
        <span  style="margin: 16px 0 0 10px;">Nam</span>
      </div>
      <div class="Gender">
        <input  name="gender" type="checkbox" value="female" class="form-control">
        <span style="margin: 16px 0 0 10px;">Nữ</span>
      </div>
      <div class="Gender">
        <input  name="gender" type="checkbox" value="orther" class="form-control">
        <span style="margin: 16px 0 0 10px;">Khác</span>
      </div>
      <span class="form-message"></span>
    </div>
    <button class="form-submit">Đăng ký</button>

  </form>
