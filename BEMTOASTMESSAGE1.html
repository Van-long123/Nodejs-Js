<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .btn{
            display: inline-block;
            background-color: transparent;
            border: none;
            /* và ngoài ra còn có outline  */
            outline: none;
            color: #fff;
            padding:12px 50px;
            border-radius: 50px;
            cursor: pointer;
            transition: 1s ease;
            /* kiểu nhỏ nhất là 100px khi mà đặt thàng nào có width dưới 100 thì nó vẫn sẽ là 100px  */
            min-width: 120px;
        }
        .btn:hover{
            /* đọ mờ  */
            opacity: 0.8;
        }
        .btn--success{
            background-color: #71be34;
        }
        .btn--warn{
            background-color: #ffb702;

        }
        .btn--danger{
            background-color: #ff623d;
        }
    body {
        height: 100vh;
        display: flex;
    }

    body>div {
        margin: auto;
    }

    #toast {
        /* nó nằm ở đó khi mà nó hiện ra nó phải trôi từ bên ngoài vào 
        thì dùng transform */
        position: fixed;
        top: 32px;
        right: 40px;
    }

    /* cái toast này khi mà show vào nó sẽ hiện vài s rồi nó mờ dần tới lúc ẩn dần
    dùng  thêm một animation cho nó mờ dần đi*/
    .toast {
        display: flex;
        justify-content: center;
        align-items: center;
        border-left: 4px solid;
        background-color: #fff;
        border-radius: 2px;
        /* toar xuoongs duoiws 5px ,8px ddoj mowf  */
        box-shadow: 0 5px 8px rgba(0, 0, 0, 0.08);
        padding: 20px 0;
        margin-bottom: 20px;
        min-width: 400px;
        max-width: 450px;
        /* h làm thế nào để nó ẩn đi 

         /* có nghĩa là nó theo trục ngang và nó dương thì nó thụt vào bên trong 100% là hết luôn */
        /* cái toast luôn nhưng tại vì có right:40px ở trên là nó thụt ra 40px nên 100% thì nó thụt vào nhưng vào 40px nữa  */
        /* transform: translateX(100%);
         */
        /* transform: translateX(calc(100% + 40px)); */
        /* linear cho nó đều nó sẽ từ từ mờddi trong vòng 1s và 3s là 3s sau mới bắt đầu bị mờ đi nhưng nó lại nổi lên lại 
         animation: slideInleft ease 0.3s 0s forwards , fadeOut linear 1s 3s forwards;
 */
 /* h xét thời gian cho nó nên để qua bên js để xét  */
        /* animation: slideInleft ease 0.3s, fadeOut linear 1s 3s forwards; */

/* tất cả thây  đổi  linear là kiêur đêif đều */
        transition: all linear .3s;
    }

    /* khi dùng thằng này thì kiểu gì kiểu nó vẫn sẽ quay trở lại vị trí ban đầu muốn nó dừng ở điểm cuốicủa amination thì thêm forwrads  */
    @keyframes slideInleft {

        /* điểm bắt đầu 
        nó sẽ trượt đến tránlatex(0) */
        from {
            opacity: 0;
            transform: translateX(calc(100% + 40px));
        }

        /* đến  */
        to {
            /* vào đến nơi thì opacity =1  */
            opacity: 1;
            transform: translateX(0);
        }
    }

    /* làm cho mừo dần  */
    @keyframes fadeOut {

        /* thì thằng này nó đang dừng ở opacity;1  */
        /* nên chỉ dùng to thôi ko cần from  */
        /* bị mờ đi nhưng nó lại nổi lên lại khi nó chạy hết animation to {opacity:0} này thì nó quay lại trạng thái ban đầu của nó
        thế là này để cho nó dừng ở điểm cuối amination này thêm vào foward thì nó sẽ dừng lại điểm cuối của amination*/
        to {
            opacity: 0;
        }
    }

    .toast__icon {
        font-size: 24px;
    }

    .toast__close {
        font-size: 20px;
        color: rgba(0, 0, 0, 0.3)
    }

    .toast__close,
    .toast__icon {
        padding: 0 16px;
    }

    .toast__body {
        /* để khi content nó ngắn nó vẫn chiếm hết khoảng ko của nó để đẩy items sát ra bên phải   */
        flex-grow: 1;
    }

    .toast__body-title {

        font-size: 16px;
        font-weight: 600;
        color: #333;
    }

    .toast__body-msg {
        line-height: 19px;
        font-size: 14px;
        color: #888;
        margin: top 4px;
    }

    .toast--success {
        border-color: #47d864;
    }

    .toast--info {
        border-color: #2f86eb;

    }

    .toast--warn {
        border-color: #ffc021;

    }

    .toast--error {
        border-color: #ff623d;

    }

    .toast--success .toast__icon {
        color: #47d864;
    }

    .toast--info .toast__icon {
        color: #2f86eb;

    }

    .toast--warn .toast__icon {
        color: #ffc021;

    }

    .toast--error .toast__icon {
        color: #ff623d;

    }
</style>

<body>
    <div id="toast">
        <!-- ta sẽ dùng js để tạo ra thằng dưới này  -->

        <!-- duoi đây là cách dặt thông thường  -->

                <i class="fas fa-check-circle"></i>
            </div>
            <div class="toast__body">
                <h3 class="toast__body-title">Success</h3>
                <p class="toast__body-msg">Ví dụ dùng BEM tạo Toast Message UI tạo Toast Message UI tạo Toast Message UI</p>
            </div>
            <div class="toast__close">
                <i class="fas fa-times"></i>

    </div>



    </div>
    <!-- cos nghĩa là khi nhấn vào dó thì message nó sẽ bắn vào  -->
    <div onclick="showSuccessToast()" class="btn btn--success">Show success toast</div>
    <div onclick="showerrorToast()" class="btn btn--danger">Show error toast</div>
    <!-- <div class="btn btn--success">Show success toast</div>
    <div class="btn btn--success">Show success toast</div> -->
    <script>
        // chúng ta sẽ gọi tới toast và truyền vào title truyền vào message và truyền vào cái type để nó là kiểu info success ...
        function toast({ title = '', message = '', type = 'info', duration = 3000 }) {
            const main = document.getElementById('toast')
            // tạo ra cái biến thây đổi icon khi success error ìno.. 
            const icons={
                success:'fas fa-check-circle',
                info:'fas fa-info-circle',
                warn:'fas fa-exclamation-circle',
                error:'fas fa-exclamation-circle',
            }
            // dựa vào cái type dder lấy đc icon tương đương 
            const icon=icons[type]
            const delay=(duration/1000).toFixed(2)// lấy ra hai số thập phân
            // nếu có ông main ta mới tạo ra nội dụng toast trong id 
            if (main) {
                // tạo document.createElement('div') chỉ có document.createElement này mới dcd còn mà một thằng div. thì ko đc 
                const toast = document.createElement('div')// chính là thằng <div class="toast toast--succes"> chauw đưa modifile vào vội 
                    toast.classList.add('toast',`toast--${type}`)//khi add class toast xong ta add thêm animation
                    // h làm sao để 3000ml s ra đc thằnh 3s 
                    toast.style.animation=`slideInleft ease 0.3s, fadeOut linear 1s ${delay}s forwards`;
                // taoj xong thằng cha h thêm nội dung con vào trong nó 
                // innerhtml laf thêm element vào element 
                toast.innerHTML =`
                <div class="toast__icon ">
                    <i class="${icon}"></i>
                </div>
                <div class="toast__body">
                    <h3 class="toast__body-title">${title}</h3>
                    <p class="toast__body-msg">${message}</p>
                </div>
                <div class="toast__close">
                    <i class="fas fa-times"></i>
                </div>
                `;
                // đưa toast vào trong thằng main 
                main.appendChild(toast)
                // khi giải quyết xong thì nó giật nó nhẩy mạnh thêm transition ở .toast vào
                setTimeout(() => {
                    main.removeChild(toast)
                    // này dùng ml giây còn cái thằng animation dùng s 
                }, duration+1000);
            }
        }
        
        // tiếp theo là bâms vào nút nhấn nó show ra 
        // xẩy ra lỗi càng bấm thì nó lại hiện thông báo càng rớt xuống dưới 
        // lý do là nó ẩn đi = Animation thôi thực ra là nó vẫn còn ở trong đoạn code function toast ta thêm code vào trong id =toast ở đoạn code trong function toast và khi nhấn lần tiếp theo thì nó tiếp
        // nên h khi nó ẩn đi thì ta gỡ bỏ nó đi luôn ta sẽ dùng settimeout
        function showerrorToast(){
            toast({
                title: "Thất bại",
                message: "Có lỗi xảy ra,vui lòng liên hệ quản trị viên",
                type: 'error',
                //khoảng thời gian bao nhiêu lâu là ẩn là
                duration: 3000
        })
        }
        function showSuccessToast(){
            toast({
                title: "Thành công",
                message: "Bạn đã đăng ký thành công",
                type: 'success',
                //khoảng thời gian bao nhiêu lâu là ẩn là
                duration: 3000
        })
           
        }
    </script>
</body>
