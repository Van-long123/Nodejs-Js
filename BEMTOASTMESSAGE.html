<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        display: flex;
        height: 100vh;
    }

    body>div {
        margin: auto;
    }

    .btn {
        display: inline-block;
        border: none;
        outline: none;
        border-radius: 50px;
        cursor: pointer;
        padding: 12px 50px;
        color: #fff;
        transition: 1s ease;
    }

    .btn:hover {
        opacity: 0.8;
    }

    .btn--success {
        background-color: #71be34;
    }

    .btn--danger {
        background-color: #ff623d;
    }

    #toast {
        position: fixed;
        top: 32px;
        right: 40px;
    }

    .toast {
        display: flex;
        justify-content: center;
        align-items: center;
        border-left: 4px solid;
        box-shadow: 0 5px 8px rgba(0, 0, 0, 0.08);
        padding: 12px 0;
        margin-bottom: 20px;
        max-width: 450px;
        min-width: 400px;
        transition: all linear 0.3s;
        /* animation: slideInleft ease 0.3s,fadeout linear 1s 3s forwards ; */
    }
    @keyframes slideInleft{
        from{
            opacity: 0;
            transform: translateX(calc(100% + 40px));
        }
        to{
            opacity: 1;
            transform: translateX(0);
        }
        
    }
    @keyframes fadeout{
        to{
            opacity: 0;
        }
        
    }
    .toast__icon {
        font-size: 24px;
    }

    .toast__icon,
    .toast__close {
        padding: 0 16px;
    }

    .toast__body-title {

        font-size: 20px;
        font-weight: 600;
        color: #333;
    }

    .toast__body-msg {
        line-height: 19px;
        font-size: 14px;
        color: #888;
        margin-top: 3px;
    }

    .toast__close {
        font-size: 20px;
        color: rgba(0, 0, 0, 0.3);
        cursor: pointer
    }

    .toast__body {
        flex-grow: 1;
    }
    .toast--success{
        border-color: #47d864;
    }
    .toast--success .toast__icon {
        color: #47d864;
    }
    .toast--error{
        color: #ff623d;
    }
    .toast--error .toast__icon {
        color: #ff623d;
    }
</style>

<body>
    <div id="toast">
        <!-- <div class="toast toast--succes">
            <div class="toast__icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <div class="toast__body">
                <h3 class="toast__body-title">succes</h3>
                <p class="toast__body-msg">Bạn đã đăng ký thành công</p>
            </div>
            <div class="toast__close">
                <i class="fas fa-times"></i>
            </div>
        </div> -->
    </div>

    <div onclick="showSuccessToast()" class="btn btn--success">Show success toast</div>
    <div onclick="showerrorToast()" class="btn btn--danger">Show error toast</div>

    <script>
        function showerrorToast() {
            toast({
                title: "Thất bại",
                message: "Có lỗi xảy ra,vui lòng liên hệ quản trị viên",
                type: 'error',
                //khoảng thời gian bao nhiêu lâu là ẩn là
                duration: 5000
            })
        }
        function showSuccessToast() {
            toast({
                title: "Thành công",
                message: "Bạn đã đăng ký thành công",
                type: 'success',
                //khoảng thời gian bao nhiêu lâu là ẩn là
                duration: 5000
            })

        }
    </script>
    <script src="BEMTOASTMESSAGE.js"></script>
</body>

</html>
