<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="FORMBAI1VD.css">
</head>
<body>
    <div class="main">
      <!-- Khi method="POST" được sử dụng, dữ liệu từ form sẽ được gửi dưới dạng yêu cầu HTTP POST. Điều này có nghĩa là dữ liệu form sẽ được đóng gói và gửi kèm với yêu cầu HTTP đến máy chủ web. -->
  <form action="" method="POST" class="form" id="form-1">
    <h3 class="heading">Thành viên đăng ký</h3>
    <p class="desc">học lập trình  ❤️</p>

    <div class="spacer"></div>

    <!-- thêm class invalid thì sẽ màu đỏ  -->
    <!-- <div class="form-group invalid"> -->
    <div class="form-group ">
      <label for="fullname" class="form-label">Tên đầy đủ</label>
      <!-- ví dụ của form bài 3   -->
      <!-- <div>
        <div style="display: flex; flex-direction: column;"> -->
          <input id="fullname" name="fullname" type="text" placeholder="VD: Long Phạm" class="form-control">
        <!-- </div>
      </div> -->
     <!-- dùng để thông báo lỗi khi có lỗi  thì nó mỡi hiển thị ra-->
      <!-- <span class="form-message">vui lòng nhập trường này</span> -->
      <span class="form-message"></span>
    
    </div>

    <div class="form-group">
      <label for="email" class="form-label">Email</label>
      <input id="email" name="email" type="text" placeholder="VD: email@long.com" class="form-control">
      <span class="form-message"></span>
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Mật khẩu</label>
      <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" class="form-control">
      <span class="form-message"></span>
    </div>

    <div class="form-group">
      <label for="password_confirmation" class="form-label">Nhập lại mật khẩu</label>
      <input   id="password_confirmation" name="password_confirmation" placeholder="Nhập lại mật khẩu" type="password" class="form-control">
      <span class="form-message"></span>
    </div>

    <!-- dưới đây là file thì cũng như input thế thôi nhưng nó sẽ trả về value là chỗ lưu file
    ddos là vấn đề  sẽ ko đc lấy value  file là phải lấy input file-->
    <div class="form-group">
      <label for="avatar" class="form-label">ảnh đại diện</label>
      <input   id="avatar" name="avatar"  type="file" class="form-control">
      <span class="form-message"></span>
    </div>

<!-- hoạt động giống như input thees thooi chọn là có giá trị trên input luôn chỉ .value là lấy về
và bài toán tiếp là  nhấn chọn vào v là lôix ngay thì dùng onchange-->
    <div class="form-group">
      <label for="province" class="form-label">Tỉnh/TP</label>
      <select   id="province" name="province" class="form-control">
        <option value="">--chọn tỉnh/tp--</option>
        <option value="hni">hà Nội</option>
        <option value="hpg">Phải Phòng</option>

      </select>
      <span class="form-message"></span>
    </div>

    <!-- đặt rule cho ông radio này 
    kiểu radi là chọn một còn checkbõ là chọn nhiều đc kiểu chọnn nhiều nhưng nó chỉ chọn đc một thằng đầu tiên đó là lỗi của checkbox 
    -->
    <div class="form-group">
      <label for="password_confirmation" class="form-label">Giới tính</label>
      <div class="Gender">
        <!-- có thằng checked này thì nó sẽ tự chọn thẳng còn ko là nhấn chọn đúng đắn nhất là ko nên có checked -->
        <input  name="gender" type="checkbox" value="male" class="form-control">
        <span  style="margin: 16px 0 0 10px;">Nam</span>
      </div>
      <div class="Gender">
        <input  name="gender" type="checkbox" value="female" class="form-control">
        <span style="margin: 16px 0 0 10px;">Nữ</span>
      </div>
      <div class="Gender">
        <input  name="gender" type="checkbox" value="orther" class="form-control">
        <span style="margin: 16px 0 0 10px;">Khác</span>
      </div>
      <span class="form-message"></span>
    </div>
    <button class="form-submit">Đăng ký</button>
    <!-- <button onclick="gui()" >Đăng ký</button> -->
  
  </form>
</div>
<script src="FORMBAI1VD.js"></script>
<script>
    Validator({
        Form:'#form-1',
        formGroupselector:'.form-group',
        rules:[
        // password_confirmation
            Validator.isRequired('#fullname'),
            Validator.isRequired('#email'),
            Validator.isEmail('#email'),
            Validator.isRequired('#password'),
            Validator.minLength('#password',6),
            Validator.isRequired('#province'),

            Validator.isRequired('input[name="gender"]'),//province
            Validator.isRequired('#password_confirmation'),
            Validator.confirmPass('#password_confirmation',function(){
                return document.querySelector('#password').value
            },'Mật khẩu nhập lại ko chính xác'),
            
            Validator.isRequired('#avatar')
        ],
        onSubmit:function(data){
            console.log(data)
        }
    })
</script>
</body>
</html>
